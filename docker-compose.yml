services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graceful-gut-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

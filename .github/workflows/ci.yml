name: CI

# The local development venv runs Python 3.12 because no 3.13 interpreter is
# available on the dev host. CI is therefore the authority on whether the code
# runs on the deployed Lambda runtime (3.13). See CLAUDE.md.
#
# No AWS credentials are configured here. Deployment is manual, by design.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Lint and test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff check
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Pytest
        run: python -m pytest -v

  package:
    name: Build Lambda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Guards the reproducible-build invariants: forward-slash entry names,
      # no bin/ or .exe launchers, application modules present.
      - name: Build
        run: bash scripts/build-lambda.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: .build/lambda.zip
          retention-days: 7
